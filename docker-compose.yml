services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: tripticket-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: mysql://root:@host.docker.internal:3306/emb_trip_ticket

    ports:
      - "5001:5001"

    networks:
      - tripticket-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web

    container_name: tripticket-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3006
      HOSTNAME: 0.0.0.0

      NEXT_PUBLIC_BACKEND_LAN_URL: http://localhost:5001
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5001

    ports:
      - "3006:3006"

    depends_on:
      - backend

    networks:
      - tripticket-network

networks:
  tripticket-network:
    driver: bridge