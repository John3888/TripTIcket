services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: tripticket-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PORT: 8500

    ports:
      - "8500:8500"

    networks:
      - tripticket-network
      - mysql_database_network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_BACKEND_LAN_URL: http://localhost:8500
        NEXT_PUBLIC_API_URL: http://localhost:8500/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:8500

    container_name: tripticket-frontend
    restart: unless-stopped

    environment:
      PORT: 8501
      HOSTNAME: 0.0.0.0

    ports:
      - "8501:8501"

    depends_on:
      - backend

    networks:
      - tripticket-network


networks:
  tripticket-network:
    driver: bridge

  mysql_database_network:
    external: true