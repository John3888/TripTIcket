services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: tripticket-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PORT: 5001

    ports:
      - "5001:5001"

    networks:
      - tripticket-network
      - mysql_database_network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_BACKEND_LAN_URL: http://localhost:5001
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5001

    container_name: tripticket-frontend
    restart: unless-stopped

    environment:
      PORT: 3006
      HOSTNAME: 0.0.0.0

    ports:
      - "3006:3006"

    depends_on:
      - backend

    networks:
      - tripticket-network


networks:
  tripticket-network:
    driver: bridge

  mysql_database_network:
    external: true